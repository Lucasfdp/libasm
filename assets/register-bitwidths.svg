<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Menlo, Consolas, monospace">
  <rect x="0" y="0" width="640" height="300" fill="#ffffff"/>

  <!-- byte cells, left = MSB (byte7) ... right = LSB (byte0) -->
  <g font-size="13" text-anchor="middle">
    <!-- cell backgrounds -->
    <g fill="#eef2f7" stroke="#94a3b8">
      <rect x="40"  y="40" width="70" height="46"/>
      <rect x="110" y="40" width="70" height="46"/>
      <rect x="180" y="40" width="70" height="46"/>
      <rect x="250" y="40" width="70" height="46"/>
      <rect x="320" y="40" width="70" height="46" fill="#dbeafe"/>
      <rect x="390" y="40" width="70" height="46" fill="#dbeafe"/>
      <rect x="460" y="40" width="70" height="46" fill="#bfdbfe"/>
      <rect x="530" y="40" width="70" height="46" fill="#93c5fd"/>
    </g>
    <!-- cell labels -->
    <g fill="#1e293b">
      <text x="75"  y="67">byte7</text>
      <text x="145" y="67">byte6</text>
      <text x="215" y="67">byte5</text>
      <text x="285" y="67">byte4</text>
      <text x="355" y="67">byte3</text>
      <text x="425" y="67">byte2</text>
      <text x="495" y="67">byte1</text>
      <text x="565" y="67">byte0</text>
    </g>
  </g>

  <!-- rax: full 64 bits -->
  <line x1="40" y1="100" x2="600" y2="100" stroke="#334155" stroke-width="2"/>
  <line x1="40" y1="94" x2="40" y2="100" stroke="#334155" stroke-width="2"/>
  <line x1="600" y1="94" x2="600" y2="100" stroke="#334155" stroke-width="2"/>
  <text x="320" y="118" text-anchor="middle" font-size="14" fill="#0f172a">rax — full 64 bits</text>

  <!-- eax: lower 32 bits (byte3..byte0) -->
  <line x1="320" y1="140" x2="600" y2="140" stroke="#2563eb" stroke-width="2"/>
  <line x1="320" y1="134" x2="320" y2="140" stroke="#2563eb" stroke-width="2"/>
  <line x1="600" y1="134" x2="600" y2="140" stroke="#2563eb" stroke-width="2"/>
  <text x="460" y="158" text-anchor="middle" font-size="14" fill="#1d4ed8">eax — lower 32 bits</text>

  <!-- ax: lower 16 bits (byte1..byte0) -->
  <line x1="460" y1="180" x2="600" y2="180" stroke="#0891b2" stroke-width="2"/>
  <line x1="460" y1="174" x2="460" y2="180" stroke="#0891b2" stroke-width="2"/>
  <line x1="600" y1="174" x2="600" y2="180" stroke="#0891b2" stroke-width="2"/>
  <text x="530" y="198" text-anchor="middle" font-size="14" fill="#0e7490">ax — lower 16 bits</text>

  <!-- al: byte0 only -->
  <line x1="530" y1="220" x2="600" y2="220" stroke="#b45309" stroke-width="2"/>
  <line x1="530" y1="214" x2="530" y2="220" stroke="#b45309" stroke-width="2"/>
  <line x1="600" y1="214" x2="600" y2="220" stroke="#b45309" stroke-width="2"/>
  <text x="565" y="238" text-anchor="middle" font-size="14" fill="#92400e">al — lowest byte</text>

  <!-- ah callout: byte1 only (legacy, rax-rdx family only) -->
  <line x1="460" y1="30" x2="460" y2="14" stroke="#7c3aed" stroke-width="2"/>
  <line x1="460" y1="14" x2="620" y2="14" stroke="#7c3aed" stroke-width="2"/>
  <text x="622" y="18" font-size="12.5" fill="#6d28d9">ah (2nd-lowest byte — rax/rbx/rcx/rdx family only)</text>

  <text x="320" y="270" text-anchor="middle" font-size="12.5" fill="#475569">
    Same nesting pattern applies to rbx/ebx/bx/bl, rcx/ecx/cx/cl, rdx/edx/dx/dl.
  </text>
  <text x="320" y="288" text-anchor="middle" font-size="12.5" fill="#475569">
    r8–r15 follow the numeric pattern instead: r8 / r8d / r8w / r8b (no "high byte" view).
  </text>
</svg>
